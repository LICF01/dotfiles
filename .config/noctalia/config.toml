[backdrop]
enabled = true

[bar.default]
center = []
end = [
    "tray",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "widget",
    "rate",
    "widget_2",
    "clock",
    "notifications"
]
margin_ends = 0
radius = 0
shadow = false
start = [ "control-center", "workspaces", "media" ]
widget_spacing = 10

[control_center]
sidebar = "full"
sidebar_section = "full"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.00006103515625
    cy = 817.99993896484375
    output = "eDP-1"
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."noctalia/translator"]
target_lang = "es"

[plugin_settings."vinioli/currency-exchange"]
converter_open_near_click = true
display_mode = "icon"
target_currency = "PYG"

[plugins]
enabled = [
    "yuuto/calculator",
    "congluantran/calibre",
    "oldirtty/color_picker",
    "alexander/screen-toolkit",
    "noctalia/screen_recorder",
    "noctalia/translator",
    "noctalia/wallhaven",
    "vinioli/currency-exchange"
]

[shell]
font_family = "JetBrainsMono Nerd Font"

    [shell.panel]
    clipboard_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Moon"
mode = "dark"
shell_mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "ghostty", "kitty", "niri", "starship" ]
    community_ids = [ "claude-code", "brave", "zen-browser", "micro", "steam", "fzf", "tmux" ]

[wallpaper]
directory = "/home/lucas/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/lucas/Pictures/wallpapers/TokyoNight/wallhaven-9mxz8k-tokyonight.png"

    [wallpaper.last]
    path = "/home/lucas/Pictures/wallpapers/TokyoNight/wallhaven-9mxz8k-tokyonight.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/lucas/Pictures/wallpapers/TokyoNight/wallhaven-9mxz8k-tokyonight.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/lucas/Pictures/wallpapers/TokyoNight/wallhaven-9mxz8k-tokyonight.png"

[widget.media]
hide_when_no_media = true

[widget.rate]
type = "vinioli/currency-exchange:rate"

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.widget_2]
type = "alexander/screen-toolkit:widget"
